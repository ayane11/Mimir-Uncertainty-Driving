_target_: navsim.agents.mimir_rl.mimir_sel_agent.MimirSelAgent
_convert_: 'all'

config:
  _target_: navsim.agents.mimir_rl.mimir_sel_config.MimirConfig
  _convert_: 'all'

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: 'all'
    time_horizon: 4
    interval_length: 0.5

  latent: False
  training: False
  use_proj_image: False
  use_gt_goal_train: True
  status_norm: False
  use_unc_score: True
  use_wm: True
  wm_num_future_frames: 3
  num_groups: 8

  navi_path: ''
  unc_path: ''
  goal_coord_path: null
  navi_unc_outputdir: null

checkpoint_path: null
lr: 2.5e-5
